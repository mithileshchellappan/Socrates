# XcodeGen spec. Run `xcodegen generate`; the .xcodeproj is generated and not committed.
# Only the integrator edits this file (see CLAUDE.md).
name: StudyPortal

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.5"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  StudyCore:
    path: Packages/StudyCore
  Capture:
    path: Packages/Capture
  Transcription:
    path: Packages/Transcription
  ClaudeKit:
    path: Packages/ClaudeKit
  Alignment:
    path: Packages/Alignment
  Processing:
    path: Packages/Processing
  StudyUI:
    path: Packages/StudyUI
  Courses:
    path: Packages/Courses
  Filing:
    path: Packages/Filing
  Review:
    path: Packages/Review
  Search:
    path: Packages/Search
  Mail:
    path: Packages/Mail
  MailIntelligence:
    path: Packages/MailIntelligence
  MailUI:
    path: Packages/MailUI
  Agent:
    path: Packages/Agent
  CalendarUI:
    path: Packages/CalendarUI
  ChatUI:
    path: Packages/ChatUI
  StudyPass:
    path: Packages/StudyPass
  Tutor:
    path: Packages/Tutor
  Notes:
    path: Packages/Notes
  AppAgent:
    path: Packages/AppAgent
  Coach:
    path: Packages/Coach

targets:
  StudyPortal:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Shared
      - path: App/macOS
        destinationFilters: [macOS]
      - path: App/iOS
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Study Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Records lectures you choose to record.
        NSSpeechRecognitionUsageDescription: Shows live captions while a lecture is recorded.
        NSCalendarsFullAccessUsageDescription: Shows your classes and deadlines and keeps the Study Portal calendar up to date.
        # studyportal://session/<id> and studyportal://item/<id>: links on the Study Portal
        # calendar's events open the lecture or the mail a deadline was read from.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.studyportal
            CFBundleURLSchemes: [studyportal]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        # Live capture writes `<uuid>.lecture` folders; declared as a package so Finder and the
        # import dialog treat one as a single item.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.studyportal.lecture
            UTTypeDescription: Study Portal Lecture
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [lecture]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: StudyPortal
        PRODUCT_BUNDLE_IDENTIFIER: com.example.studyportal
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # macOS: unsandboxed personal build, hardened runtime with mic + calendars.
        ENABLE_APP_SANDBOX: NO
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/macOS/StudyPortal.entitlements
        "COMBINE_HIDPI_IMAGES[sdk=macosx*]": YES
      configs:
        # The macOS Debug build is signed with the team's Developer ID (""), so its
        # designated requirement stays the same across rebuilds and the Keychain's "Always Allow"
        # sticks (ad-hoc signing changed it on every build). No provisioning profile is needed:
        # the app uses no restricted entitlements. See docs/decisions.md.
        Debug:
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""
    dependencies:
      - package: StudyCore
      - package: Capture
        product: Capture
      - package: Capture
        product: CaptureUI
      - package: Transcription
        product: Transcription
      - package: ClaudeKit
      - package: Alignment
        product: Alignment
      - package: Processing
      # M1 (docs/plan-m1.md). StudyUITesting is test-only and never linked here.
      - package: StudyUI
        product: StudyUI
      - package: Courses
        product: Courses
      - package: Courses
        product: CalendarSync
      - package: Courses
        product: CoursesUI
      - package: Filing
        product: Filing
      - package: Filing
        product: FilingUI
      - package: Review
        product: Review
      - package: Review
        product: ReviewUI
      - package: Search
        product: Search
      - package: Search
        product: SearchUI
      # M2 (docs/plan-m2.md): mail transport, mail intelligence, Mail screen.
      - package: Mail
        product: Mail
      - package: MailIntelligence
        product: MailIntelligence
      - package: MailUI
        product: MailUI
      # M3 (docs/plan-m3.md): the deadline memory and the agent, the Calendar screen.
      - package: Agent
        product: Deadlines
      - package: Agent
        product: Agent
      - package: CalendarUI
        product: CalendarUI
      # M3.5 (docs/plan-m35.md): the chat with the agent, the inspector of Today and Mail.
      - package: ChatUI
        product: ChatUI
      # M4 (docs/plan-m4.md): the AI study pass. Compiles on macOS and iOS, runs on the Mac only.
      - package: StudyPass
        product: StudyPass
      # M5 (docs/plan-m5.md): the tutor (lecture tools, context blocks); search lives in Search.
      - package: Tutor
        product: Tutor
      # M6 (docs/plan-m6.md): Apple Notes-style notes (the Notes screen, the rich editor).
      - package: Notes
        product: Notes
      - package: Notes
        product: NotesUI
      # ma (docs/plan-agent.md): one agent across the app (catalog, triage, tasks, change log).
      - package: AppAgent
        product: AppAgent
      # mc (docs/plan-coach.md): the study coach (plan, practice rounds, practice exams).
      - package: Coach
        product: Coach
      - package: Coach
        product: CoachUI
