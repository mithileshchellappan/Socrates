# XcodeGen spec. Run `xcodegen generate`; the .xcodeproj is generated and not committed.
# Only the integrator edits this file (see CLAUDE.md).
name: StudyPortal

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.5"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  StudyCore:
    path: Packages/StudyCore
  Capture:
    path: Packages/Capture
  Transcription:
    path: Packages/Transcription
  ClaudeKit:
    path: Packages/ClaudeKit
  Alignment:
    path: Packages/Alignment
  Processing:
    path: Packages/Processing
  StudyUI:
    path: Packages/StudyUI
  Courses:
    path: Packages/Courses
  Filing:
    path: Packages/Filing
  Review:
    path: Packages/Review
  Search:
    path: Packages/Search
  Mail:
    path: Packages/Mail
  MailIntelligence:
    path: Packages/MailIntelligence
  MailUI:
    path: Packages/MailUI
  Agent:
    path: Packages/Agent
  CalendarUI:
    path: Packages/CalendarUI
  ChatUI:
    path: Packages/ChatUI
  StudyPass:
    path: Packages/StudyPass
  Tutor:
    path: Packages/Tutor
  Notes:
    path: Packages/Notes
  AppAgent:
    path: Packages/AppAgent
  Coach:
    path: Packages/Coach
  # M7 (docs/plan-m7.md): the iPhone recorder and its Live Activity, the phone's shell, iCloud sync.
  Recorder:
    path: Packages/Recorder
  Phone:
    path: Packages/Phone
  Sync:
    path: Packages/Sync
  # md (docs/plan-docs.md): the document bank. Mac only in the app (documents never sync).
  Documents:
    path: Packages/Documents

targets:
  StudyPortal:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Shared
      - path: App/macOS
        destinationFilters: [macOS]
      - path: App/iOS
        destinationFilters: [iOS]
      # M7: the Live Activity's intents and views, compiled into the app and the widget extension
      # (Live Activity buttons run their intents in the app's process).
      - path: Widgets/Shared
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Study Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Records lectures you choose to record.
        # M7: the iPhone's agent sheet (Take Photo of the board).
        NSCameraUsageDescription: Takes a photo to ask about.
        NSSpeechRecognitionUsageDescription: Shows live captions while a lecture is recorded.
        NSCalendarsFullAccessUsageDescription: Shows your classes and deadlines and keeps the Study Portal calendar up to date.
        # studyportal://session/<id> and studyportal://item/<id>: links on the Study Portal
        # calendar's events open the lecture or the mail a deadline was read from.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.studyportal
            CFBundleURLSchemes: [studyportal]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # M7: the recording's Live Activity (Lock Screen + Dynamic Island), from StudyPortalWidgets.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        # Live capture writes `<uuid>.lecture` folders; declared as a package so Finder and the
        # import dialog treat one as a single item.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.studyportal.lecture
            UTTypeDescription: Study Portal Lecture
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [lecture]
          # M7: one `.lecture` package as a single file (Apple Archive), shared from the iPhone
          # by Share / AirDrop; the Mac's smart import unpacks and files it.
          - UTTypeIdentifier: com.example.studyportal.lecture-bundle
            UTTypeDescription: Study Portal Recording
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lecturebundle]
        # M7: the Mac opens an AirDropped or double-clicked capture (smart import files it).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Study Portal Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.example.studyportal.lecture-bundle, com.example.studyportal.lecture]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: StudyPortal
        PRODUCT_BUNDLE_IDENTIFIER: com.example.studyportal
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # macOS: unsandboxed personal build, hardened runtime with mic + calendars.
        ENABLE_APP_SANDBOX: NO
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/macOS/StudyPortal.entitlements
        "COMBINE_HIDPI_IMAGES[sdk=macosx*]": YES
      configs:
        # The macOS Debug and Release builds are signed with the team's Developer ID (""),
        # so the designated requirement stays the same across rebuilds and the Keychain's "Always
        # Allow" sticks (ad-hoc signing changed it on every build). No provisioning profile is
        # needed: the app uses no restricted entitlements. Release signs the same way (there is no
        # "Mac Development" certificate on this Mac). See docs/decisions.md.
        Debug:
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""
        Release:
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": ""
    dependencies:
      - package: StudyCore
      - package: Capture
        product: Capture
      - package: Capture
        product: CaptureUI
      - package: Transcription
        product: Transcription
      - package: ClaudeKit
      - package: Alignment
        product: Alignment
      - package: Processing
      # M1 (docs/plan-m1.md). StudyUITesting is test-only and never linked here.
      - package: StudyUI
        product: StudyUI
      - package: Courses
        product: Courses
      - package: Courses
        product: CalendarSync
      - package: Courses
        product: CoursesUI
      - package: Filing
        product: Filing
      - package: Filing
        product: FilingUI
      - package: Review
        product: Review
      - package: Review
        product: ReviewUI
      - package: Search
        product: Search
      - package: Search
        product: SearchUI
      # M2 (docs/plan-m2.md): mail transport, mail intelligence, Mail screen.
      - package: Mail
        product: Mail
      - package: MailIntelligence
        product: MailIntelligence
      - package: MailUI
        product: MailUI
      # M3 (docs/plan-m3.md): the deadline memory and the agent, the Calendar screen.
      - package: Agent
        product: Deadlines
      - package: Agent
        product: Agent
      - package: CalendarUI
        product: CalendarUI
      # M3.5 (docs/plan-m35.md): the chat with the agent, the inspector of Today and Mail.
      - package: ChatUI
        product: ChatUI
      # M4 (docs/plan-m4.md): the AI study pass. Compiles on macOS and iOS, runs on the Mac only.
      - package: StudyPass
        product: StudyPass
      # M5 (docs/plan-m5.md): the tutor (lecture tools, context blocks); search lives in Search.
      - package: Tutor
        product: Tutor
      # M6 (docs/plan-m6.md): Apple Notes-style notes (the Notes screen, the rich editor).
      - package: Notes
        product: Notes
      - package: Notes
        product: NotesUI
      # ma (docs/plan-agent.md): one agent across the app (catalog, triage, tasks, change log).
      - package: AppAgent
        product: AppAgent
      # mc (docs/plan-coach.md): the study coach (plan, practice rounds, practice exams).
      - package: Coach
        product: Coach
      - package: Coach
        product: CoachUI
      # M7 (docs/plan-m7.md): the iPhone recorder, its Live Activity and the phone's shell (iOS);
      # iCloud sync (both, off unless the build is signed for CloudKit).
      - package: Recorder
        product: RecorderActivity
        destinationFilters: [iOS]
      - package: Recorder
        product: Recorder
        destinationFilters: [iOS]
      - package: Recorder
        product: RecorderUI
        destinationFilters: [iOS]
      - package: Phone
        product: PhoneUI
        destinationFilters: [iOS]
      - package: Sync
        product: Sync
      # md (docs/plan-docs.md): the document bank and the Documents screen, Mac only (documents
      # never sync; the iPhone has no Documents). AppAgent depends on Documents on both platforms.
      - package: Documents
        product: Documents
        destinationFilters: [macOS]
      - package: Documents
        product: DocumentsUI
        destinationFilters: [macOS]
      - target: StudyPortalWidgets
        destinationFilters: [iOS]
        embed: true

  # M7 (docs/plan-m7.md §3): the recording's Live Activity (Lock Screen + Dynamic Island). Its views
  # and the two button intents are in Widgets/Shared, which the app compiles too.
  StudyPortalWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Study Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: StudyPortalWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.example.studyportal.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: Recorder
        product: RecorderActivity
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
