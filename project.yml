# XcodeGen spec. Run `xcodegen generate`; the .xcodeproj is generated and not committed.
# Only the integrator edits this file (see CLAUDE.md).
#
# Signing and the bundle ID prefix come from Config/Signing.xcconfig, which includes
# Config/Local.xcconfig when it exists (not committed; copy Config/Local.xcconfig.example). Without
# it no team is set and the Mac app is signed to run locally (ad-hoc).
name: Socrates

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.5"

settings:
  base:
    DEVELOPMENT_TEAM: $(SOCRATES_TEAM)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  StudyCore:
    path: Packages/StudyCore
  Capture:
    path: Packages/Capture
  Transcription:
    path: Packages/Transcription
  ClaudeKit:
    path: Packages/ClaudeKit
  Alignment:
    path: Packages/Alignment
  Processing:
    path: Packages/Processing
  StudyUI:
    path: Packages/StudyUI
  Courses:
    path: Packages/Courses
  Filing:
    path: Packages/Filing
  Review:
    path: Packages/Review
  Search:
    path: Packages/Search
  Mail:
    path: Packages/Mail
  MailIntelligence:
    path: Packages/MailIntelligence
  MailUI:
    path: Packages/MailUI
  # Mail Translate (docs/plan-translation.md): local-translate's OPUS-MT models on ONNX Runtime.
  # Linked through MailUI on both platforms (the iPhone shows MailView too), so no product line.
  LocalTranslation:
    path: Packages/LocalTranslation
  Agent:
    path: Packages/Agent
  CalendarUI:
    path: Packages/CalendarUI
  ChatUI:
    path: Packages/ChatUI
  StudyPass:
    path: Packages/StudyPass
  Tutor:
    path: Packages/Tutor
  Notes:
    path: Packages/Notes
  AppAgent:
    path: Packages/AppAgent
  Coach:
    path: Packages/Coach
  # M7 (docs/plan-m7.md): the iPhone recorder and its Live Activity, the phone's shell, iCloud sync.
  Recorder:
    path: Packages/Recorder
  Phone:
    path: Packages/Phone
  Sync:
    path: Packages/Sync
  # md (docs/plan-docs.md): the document bank. Mac only in the app (documents never sync).
  Documents:
    path: Packages/Documents
  # ln (docs/plan-lecture-notes.md): Claude's study text drawn natively (the lecture notes; the
  # agent panel's Markdown parser). SwiftMath (MIT, tools/oss/notices.tsv) comes through it.
  StudyPage:
    path: Packages/StudyPage
  # panes (docs/DESIGN.md 6.4): the Mac main window's side panes and the floating panel (AppKit
  # host). Linked by the Mac app only; feature screens use StudyUI's pane vocabulary.
  Panes:
    path: Packages/Panes

targets:
  Socrates:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Shared
      - path: App/macOS
        destinationFilters: [macOS]
      - path: App/iOS
        destinationFilters: [iOS]
      # M7: the Live Activity's intents and views, compiled into the app and the widget extension
      # (Live Activity buttons run their intents in the app's process).
      - path: Widgets/Shared
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Socrates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Records lectures you choose to record.
        # M7: the iPhone's agent sheet (Take Photo of the board).
        NSCameraUsageDescription: Takes a photo to ask about.
        NSSpeechRecognitionUsageDescription: Shows live captions while a lecture is recorded.
        NSCalendarsFullAccessUsageDescription: Shows your classes and deadlines and keeps the Socrates calendar up to date.
        # socrates://session/<id> and socrates://item/<id>: links on the Socrates calendar's
        # events open the lecture or the mail a deadline was read from. studyportal:// is what
        # events written before the app was renamed carry; it stays registered.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [socrates, studyportal]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        # A university profile a library with courses but none takes once (Config/Signing.xcconfig;
        # empty unless a local Config/Local.xcconfig sets it). StudyCore's UniversityProfileRecord.
        SocratesUniversityProfile: $(SOCRATES_UNIVERSITY_PROFILE)
        # M7: the CloudKit container this build syncs the library to (StudyCore's
        # CloudSyncConfiguration). Set only with SOCRATES_ICLOUD = YES, which also adds the
        # iCloud entitlement (Config/Signing.xcconfig); empty in simulator builds.
        SocratesCloudKitContainer: $(SOCRATES_SYNC_CONTAINER)
        # The bundle ID an earlier build had on this machine (Config/Signing.xcconfig; empty in
        # public builds): the Mac app takes over its library folder, preferences and Keychain
        # items once (StudyCore's AppIdentity).
        SocratesLegacyBundleID: $(SOCRATES_LEGACY_BUNDLE_ID)
        # audio: recording with the screen locked; remote-notification: iCloud sync's silent pushes.
        UIBackgroundModes: [audio, remote-notification]
        # M7: the recording's Live Activity (Lock Screen + Dynamic Island), from SocratesWidgets.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        # Live capture writes `<uuid>.lecture` folders; declared as a package so Finder and the
        # import dialog treat one as a single item.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(BUNDLE_ID_PREFIX).socrates.lecture
            UTTypeDescription: Socrates Lecture
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [lecture]
          # M7: one `.lecture` package as a single file (Apple Archive), shared from the iPhone
          # by Share / AirDrop; the Mac's smart import unpacks and files it.
          - UTTypeIdentifier: $(BUNDLE_ID_PREFIX).socrates.lecture-bundle
            UTTypeDescription: Socrates Recording
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lecturebundle]
        # M7: the Mac opens an AirDropped or double-clicked capture (smart import files it).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Socrates Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [$(BUNDLE_ID_PREFIX).socrates.lecture-bundle, $(BUNDLE_ID_PREFIX).socrates.lecture]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Socrates
        # $(BUNDLE_ID_PREFIX) comes from Config/Signing.xcconfig (com.example) or Config/Local.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).socrates
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # macOS: unsandboxed personal build, hardened runtime with mic + calendars. M7: with
        # SOCRATES_ICLOUD = YES both apps take the iCloud entitlements files (CloudKit, push);
        # the iPhone app has no entitlements file otherwise (Config/Signing.xcconfig).
        ENABLE_APP_SANDBOX: NO
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(SOCRATES_MAC_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(SOCRATES_IOS_ENTITLEMENTS)
        "COMBINE_HIDPI_IMAGES[sdk=macosx*]": YES
        # The macOS identity and style come from Config/Signing.xcconfig ("-", Automatic: signed to
        # run locally) or Config/Local.xcconfig. Apple Development (Automatic) and Developer ID keep
        # the designated requirement the same across rebuilds, so the Keychain's "Always Allow" and
        # the privacy grants stick (ad-hoc signing changes it on every build). Without iCloud no
        # provisioning profile is needed: the app uses no restricted entitlements. With iCloud (M7)
        # the Mac app needs one: Apple Development with Automatic signing makes its own; a manually
        # signed Developer ID build names its profile in SOCRATES_MAC_PROFILE. See docs/decisions.md.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": $(SOCRATES_MAC_SIGN_IDENTITY)
        "CODE_SIGN_STYLE[sdk=macosx*]": $(SOCRATES_MAC_SIGN_STYLE)
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": $(SOCRATES_MAC_PROFILE)
    dependencies:
      - package: StudyCore
      - package: Capture
        product: Capture
      - package: Capture
        product: CaptureUI
      - package: Transcription
        product: Transcription
      - package: ClaudeKit
      - package: Alignment
        product: Alignment
      - package: Processing
      # M1 (docs/plan-m1.md).
      - package: StudyUI
        product: StudyUI
      - package: Courses
        product: Courses
      - package: Courses
        product: CalendarSync
      - package: Courses
        product: CoursesUI
      - package: Filing
        product: Filing
      - package: Filing
        product: FilingUI
      - package: Review
        product: Review
      - package: Review
        product: ReviewUI
      - package: Search
        product: Search
      - package: Search
        product: SearchUI
      # M2 (docs/plan-m2.md): mail transport, mail intelligence, Mail screen.
      - package: Mail
        product: Mail
      - package: MailIntelligence
        product: MailIntelligence
      - package: MailUI
        product: MailUI
      # M3 (docs/plan-m3.md): the deadline memory and the agent, the Calendar screen.
      - package: Agent
        product: Deadlines
      - package: Agent
        product: Agent
      - package: CalendarUI
        product: CalendarUI
      # M3.5 (docs/plan-m35.md): the chat with the agent, the inspector of Today and Mail.
      - package: ChatUI
        product: ChatUI
      # M4 (docs/plan-m4.md): the AI study pass. Compiles on macOS and iOS, runs on the Mac only.
      - package: StudyPass
        product: StudyPass
      # M5 (docs/plan-m5.md): the tutor (lecture tools, context blocks); search lives in Search.
      - package: Tutor
        product: Tutor
      # M6 (docs/plan-m6.md): Apple Notes-style notes (the Notes screen, the rich editor).
      - package: Notes
        product: Notes
      - package: Notes
        product: NotesUI
      # ma (docs/plan-agent.md): one agent across the app (catalog, triage, tasks, change log).
      - package: AppAgent
        product: AppAgent
      # mc (docs/plan-coach.md): the study coach (plan, practice rounds, practice exams).
      - package: Coach
        product: Coach
      - package: Coach
        product: CoachUI
      # M7 (docs/plan-m7.md): the iPhone recorder, its Live Activity and the phone's shell (iOS);
      # iCloud sync (both, off unless SOCRATES_ICLOUD = YES signs the build for CloudKit).
      - package: Recorder
        product: RecorderContract
        destinationFilters: [iOS]
      - package: Recorder
        product: RecorderActivity
        destinationFilters: [iOS]
      - package: Recorder
        product: Recorder
        destinationFilters: [iOS]
      - package: Recorder
        product: RecorderUI
        destinationFilters: [iOS]
      - package: Phone
        product: PhoneUI
        destinationFilters: [iOS]
      - package: Sync
        product: Sync
      # md (docs/plan-docs.md): the document bank and the Documents screen, Mac only (documents
      # never sync; the iPhone has no Documents). AppAgent depends on Documents on both platforms.
      - package: Documents
        product: Documents
        destinationFilters: [macOS]
      - package: Documents
        product: DocumentsUI
        destinationFilters: [macOS]
      # mt (docs/plan-materials.md): a course's materials (books, papers, references, links). The
      # library and the reader run on the Mac; both compile for iOS (rows sync, files stay on the
      # Mac; the phone shows no Materials screen yet).
      - package: Documents
        product: Materials
      - package: Documents
        product: MaterialsUI
      # ln (docs/plan-lecture-notes.md): the lecture notes (format, views, the figure checker, the
      # Lecture menu's Ask… and Highlight).
      - package: StudyPage
        product: StudyPageFormat
      - package: StudyPage
        product: StudyPageUI
      # panes: the side panes and the floating panel, Mac only.
      - package: Panes
        product: Panes
        destinationFilters: [macOS]
      - target: SocratesWidgets
        destinationFilters: [iOS]
        embed: true

  # M7 (docs/plan-m7.md §3): the recording's Live Activity (Lock Screen + Dynamic Island). Its views
  # and the two button intents are in Widgets/Shared, which the app compiles too.
  SocratesWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Socrates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: SocratesWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).socrates.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: Recorder
        product: RecorderContract
      - package: Recorder
        product: RecorderActivity
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
